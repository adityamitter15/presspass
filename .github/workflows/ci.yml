name: CI

# Run on demand and on pull requests. Pushes to a private repository do not
# trigger it, because macOS runners use up the free minutes ten times faster.
# Add `push:` back when the repository is public, where Actions are free.
on:
  workflow_dispatch:
  pull_request:

jobs:
  core-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all package tests
        run: swift test --package-path Packages/PushupCore

  eval-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the report tests
        run: uv run --project eval pytest eval/tests
      - name: Replay a synthetic dataset end to end
        run: scripts/eval_synthetic.sh
