[project]
name = "pushup-eval-report"
version = "0.1.0"
description = "Metrics, tables and figures from pushup-eval replay output"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pushup_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
